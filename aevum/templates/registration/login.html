{% extends 'base.html' %}
{% block title %}Login | Aevum{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5">
    <div class="glass-panel p-4 rounded-5">
      <h2 class="fw-bold mb-4">Login to Aevum</h2>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3"><label class="form-label">Username</label>{{ form.username }}</div>
        <div class="mb-3"><label class="form-label">Password</label>{{ form.password }}</div>
        <button class="btn btn-premium w-100">Login</button>
      </form>
      <p class="mt-3 mb-0 text-secondary">No account yet? <a href="{% url 'register' %}">Register here</a>.</p>
    </div>
  </div>
</div>
{% endblock %}
