{% extends 'base.html' %}
{% block title %}Register | Aevum{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="glass-panel p-4 rounded-5">
      <h2 class="fw-bold mb-4">Create your Aevum account</h2>
      <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-3">
          <label class="form-label">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}<div class="text-danger small mt-1">{{ field.errors|join:', ' }}</div>{% endif %}
        </div>
        {% endfor %}
        <button class="btn btn-premium w-100">Register and Open Dashboard</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
