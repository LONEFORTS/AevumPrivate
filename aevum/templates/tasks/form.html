{% extends 'base.html' %}
{% block title %}{{ title }} | Aevum{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-8"><div class="glass-panel p-4 rounded-5"><h1 class="fw-bold mb-4">{{ title }}</h1><form method="post">{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}{% if field.errors %}<div class="text-danger small">{{ field.errors|join:', ' }}</div>{% endif %}</div>{% endfor %}<button class="btn btn-premium">Save Task</button></form></div></div></div>
{% endblock %}
