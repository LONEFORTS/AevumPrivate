<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} | Aevum Public Share</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body{background:#0b1020;color:#e8eeff;font-family:system-ui}.wrap{max-width:960px;margin:40px auto;padding:24px}.cardx{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:24px;padding:28px}pre{white-space:pre-wrap;background:#111827;padding:18px;border-radius:18px;color:#d1fae5}</style>
</head>
<body>
  <div class="wrap">
    <div class="cardx">
      <div class="badge text-bg-info mb-3">{{ kind }}</div>
      <h1 class="fw-bold mb-3">{{ title }}</h1>
      <div>{{ body_html|safe }}</div>
    </div>
  </div>
</body>
</html>
