{% extends 'base.html' %}
{% block title %}{{ title }} | Aevum{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="glass-panel p-4 rounded-5 text-center">
      <h2 class="fw-bold mb-3">{{ title }}</h2>
      <p class="text-secondary">You are about to delete <strong>{{ object_name }}</strong>.</p>
      <form method="post">{% csrf_token %}<button class="btn btn-danger">Confirm Delete</button></form>
    </div>
  </div>
</div>
{% endblock %}
